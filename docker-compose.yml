version: '3'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      # Zookeeper default port
      - "2181:2181" 
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - kafka-net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    hostname: kafka
    container_name: kafka
    depends_on:
      - zookeeper  # Zookeeper start ayyaka Kafka start avvali
    ports:
      # External access port (Host machine: 9092)
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      # Internal connection to Zookeeper container
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181 

      # Listeners define how Kafka can be accessed:
      # 1. PLAINTEXT://kafka:29092 (Internal network access by other containers)
      # 2. PLAINTEXT_HOST://localhost:9092 (External access from your host machine)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # For single-broker setup, set replication factor to 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      
    networks:
      - kafka-net

networks:
  kafka-net:
    driver: bridge