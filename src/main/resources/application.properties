spring.application.name=foodapp-backend

# 1. Database Configuration (POSTGRESQL)
# Uses environment variables (DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASS)
# The values after the colon (:) act as safe local fallbacks if the environment variables are not loaded.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:foodapp}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# REQUIRED FIX: Explicitly set the PostgreSQL Driver class name
spring.datasource.driver-class-name=org.postgresql.Driver

# REQUIRED FIX: Explicitly set the PostgreSQL Dialect for Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# JWT
jwt.secret=6A576E5A7234753778214125442A472D4B6150645367566B5970337336763979
jwt.expiration=172800000

# Multipart File Upload Settings
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

file.upload-dir=uploaded_images/

server.address=0.0.0.0

# Updated base URL for Render deployment
app.base-url=https://foodapp-backend-nfne.onrender.com